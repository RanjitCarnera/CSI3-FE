# SonarQube Configuration for React TypeScript Project

# Project identification
sonar.projectKey=CSI-FE
sonar.projectName=CSI Frontend
sonar.projectVersion=0.1.0

# Source code configuration
sonar.sources=src
sonar.tests=src/__tests__
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/*.d.ts,**/__generated__/**,**/*.graphql.ts,**/public/**,**/*.config.js,**/*.config.mjs,**/tailwind.config.mjs,**/babel-plugin-macros.config.js,**/config-overrides.js

# TypeScript/JavaScript specific settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/__generated__/**,**/*.d.ts

# Code quality settings
sonar.qualitygate.wait=true

# Language detection
sonar.sourceEncoding=UTF-8

# File patterns
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# SonarQube server configuration
